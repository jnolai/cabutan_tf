<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CABUTAN NO.FAIL (Task Force)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Library CSV Parser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- Library QR Code Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .heartbeat-box {
      animation: heartbeat 0.3s infinite ease-in-out;
    }
    .blur-motion {
      filter: blur(1.5px);
      transform: scaleY(1.15);
    }
    @keyframes ultraGlow {
      0%, 100% { border-color: rgba(239, 68, 68, 0.5); box-shadow: 0 0 12px rgba(239, 68, 68, 0.4); }
      50% { border-color: rgba(245, 158, 11, 1); box-shadow: 0 0 25px rgba(245, 158, 11, 0.8); }
    }
    .ultra-glow {
      animation: ultraGlow 0.35s infinite alternate;
    }
    @keyframes soloFinalPulse {
      0%, 100% { transform: scale(1.1); box-shadow: 0 0 25px rgba(239, 68, 68, 0.8); border-color: #ef4444; }
      50% { transform: scale(1.18); box-shadow: 0 0 45px rgba(245, 158, 11, 1); border-color: #f59e0b; }
    }
    .solo-final-active {
      animation: soloFinalPulse 0.5s infinite alternate;
      z-index: 20;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 select-none font-sans overflow-x-hidden">

  <!-- Efek Ambience Latar Belakang -->
  <div id="suspenseOverlay" class="fixed inset-0 pointer-events-none z-0 transition-all duration-300 opacity-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-red-600/35 via-amber-600/15 to-transparent"></div>

  <div class="relative z-10 max-w-5xl w-full flex flex-col items-center text-center my-auto">
    
    <!-- Bagian Judul -->
    <div class="mb-6">
      <span id="sheetStatusBadge" class="px-4 py-1.5 rounded-full text-xs font-semibold tracking-widest uppercase bg-amber-500/10 text-amber-400 border border-amber-500/30">
        Memuatkan Data...
      </span>
      <h1 class="text-3xl sm:text-5xl font-black mt-3 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-600">
        CABUTAN NO.FAIL
      </h1>
      <p id="statusText" class="text-slate-400 text-xs sm:text-sm mt-1 font-medium">
        Tekan butang CABUTAN untuk memulakan sesi
      </p>
    </div>

    <!-- Papan Paparan Nombor Fail (5 Karakter) -->
    <div id="boardContainer" class="bg-slate-900/90 backdrop-blur-md border-2 border-slate-800 p-6 sm:p-8 rounded-3xl shadow-2xl transition-all duration-300 mb-6 w-full max-w-2xl">
      
      <div id="slotBadge" class="text-xs uppercase tracking-widest text-amber-400 font-bold mb-4">
        Sedia Untuk Putaran Nombor Fail
      </div>

      <!-- Paparan 5 Kotak Digit/Aksara -->
      <div class="flex items-center justify-center gap-2 sm:gap-3 font-mono font-black">
        <div class="flex items-center mr-2 text-slate-500 text-sm sm:text-lg font-bold">
          NO. FAIL:
        </div>
        
        <div id="d0" class="bg-slate-950 border border-slate-800 text-amber-400 w-12 h-16 sm:w-16 sm:h-22 text-2xl sm:text-4xl rounded-xl flex items-center justify-center shadow-inner">S</div>
        <div id="d1" class="bg-slate-950 border border-slate-800 text-amber-400 w-12 h-16 sm:w-16 sm:h-22 text-2xl sm:text-4xl rounded-xl flex items-center justify-center shadow-inner">0</div>
        <div id="d2" class="bg-slate-950 border border-slate-800 text-amber-400 w-12 h-16 sm:w-16 sm:h-22 text-2xl sm:text-4xl rounded-xl flex items-center justify-center shadow-inner">0</div>
        <div id="d3" class="bg-slate-950 border border-slate-800 text-amber-400 w-12 h-16 sm:w-16 sm:h-22 text-2xl sm:text-4xl rounded-xl flex items-center justify-center shadow-inner">0</div>
        <div id="d4" class="bg-slate-950 border border-slate-800 text-amber-400 w-12 h-16 sm:w-16 sm:h-22 text-2xl sm:text-4xl rounded-xl flex items-center justify-center shadow-inner transition-transform duration-300">0</div>
      </div>

      <!-- Paparan Profil Pemenang, Pautan & QR Code -->
      <div id="currentWinnerBox" class="opacity-0 transition-all duration-300 mt-6 pt-5 border-t border-slate-800 flex flex-col md:flex-row items-center justify-around gap-6">
        <div class="text-center md:text-left">
          <span class="text-xs uppercase tracking-widest text-emerald-400 font-bold block mb-1">Fail Sah Disahkan</span>
          <h2 id="currentWinnerName" class="text-xl sm:text-2xl font-black text-white tracking-wide">--</h2>
          
          <div class="mt-2 inline-flex items-center gap-2 bg-slate-950/80 px-4 py-1.5 rounded-full border border-slate-800">
            <span class="text-xs text-slate-400">NO. FAIL:</span>
            <span id="currentWinnerFileNo" class="text-xs sm:text-sm font-mono font-bold text-amber-400 tracking-wider">--</span>
          </div>
        </div>

        <!-- Bahagian Butang Pautan & Kotak QR Code -->
        <div class="flex flex-col sm:flex-row items-center justify-center bg-slate-950/80 p-4 rounded-2xl border border-slate-800 gap-4">
          <!-- Kotak Paparan QR Code -->
          <div id="qrcode" class="bg-white p-2 rounded-xl shadow-md flex items-center justify-center"></div>

          <!-- Pautan & Butang Buka -->
          <div class="flex flex-col items-center sm:items-start gap-2">
            <button id="mainFolderBtn" onclick="openSelectedFolder()" class="inline-flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-bold text-xs sm:text-sm rounded-xl shadow-lg transition-all active:scale-95 cursor-pointer z-30">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
              Buka Folder Fail
            </button>
            
            <input id="mainLinkInput" type="text" readonly onclick="this.select()" class="bg-slate-900 text-[11px] text-slate-300 font-mono px-3 py-1.5 rounded-lg border border-slate-700/80 w-full max-w-[220px] text-center select-all cursor-pointer" value="--">
          </div>
        </div>
      </div>

    </div>

    <!-- Butang CABUTAN Utama -->
    <div class="flex flex-col gap-4 mb-4 w-full max-w-xl relative z-30">
      <button id="btnDraw" onclick="handleDrawClick()" class="w-full py-5 bg-gradient-to-r from-amber-500 via-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black text-xl sm:text-2xl rounded-2xl shadow-xl shadow-amber-500/20 active:scale-95 transition-all cursor-pointer">
        CABUTAN
      </button>
    </div>

  </div>

  <!-- Footer Hakcipta -->
  <footer class="relative z-10 text-center py-3 text-xs text-slate-500 font-medium tracking-wide">
    Hakcipta ©JnolAi@2026
  </footer>

  <script>
    const SPREADSHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1MUMz7nyfsWFFg9DUkQC6D19EJ7-DweFgHUa98-67Qxs/gviz/tq?tqx=out:csv';
    
    // Gantikan URL di bawah dengan "Web App URL" yang anda dapat dari Google Apps Script Deployment
    const APPS_SCRIPT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzXHYfd9QR1XKjRwMKsyUp9U7-LG4L8oLvCzxneaEbALoojJgimokyD74wLrqjGH2EmaA/exec';

    let fileRecords = [];
    const fileMap = new Map();
    const drawnWinnersSet = new Set();
    let isDrawing = false;
    let audioCtx = null;
    let currentActiveFolderUrl = '';

    function handleDrawClick() {
      if (fileRecords.length === 0) {
        alert("Pangkalan data Google Sheets sedang dimuatkan atau semua fail telah habis dicabut.");
        return;
      }
      startDrawFlow();
    }

    function openSelectedFolder() {
      if (currentActiveFolderUrl && currentActiveFolderUrl.startsWith('http')) {
        window.open(currentActiveFolderUrl, '_blank');
      } else {
        alert("Pautan Google Drive bagi fail ini tidak ditemui.");
      }
    }

    // Fungsi menghantar rekod ke Google Sheets supaya ditanda
    async function markFileAsDrawnInSheet(fileNo) {
      if (!APPS_SCRIPT_WEB_APP_URL || APPS_SCRIPT_WEB_APP_URL.includes('PAKAN_WEB')) return;
      try {
        await fetch(`${APPS_SCRIPT_WEB_APP_URL}?action=update&fileno=${encodeURIComponent(fileNo)}`, {
          method: 'GET',
          mode: 'no-cors'
        });
      } catch (err) {
        console.warn("Gagal mengemaskini Google Sheet secara langsung:", err);
      }
    }

    // Muat data Google Sheets
    async function loadGoogleSheetsData() {
      const badge = document.getElementById('sheetStatusBadge');
      try {
        const response = await fetch(SPREADSHEET_CSV_URL);
        const csvText = await response.text();
        
        Papa.parse(csvText, {
          header: false,
          skipEmptyLines: true,
          complete: function(results) {
            const data = results.data;
            fileRecords = [];
            fileMap.clear();

            data.forEach((row, idx) => {
              if (!row || row.length < 2) return;
              
              const folderName = String(row[0]).trim();
              const linkUrl = String(row[1]).trim().replace(/[\r\n\t]/g, '');
              const statusCol = row[2] ? String(row[2]).trim() : '';

              // Masukkan hanya jika belum dicabut (Lajur C bukan "TELAH DICABUT")
              if (folderName && folderName.toLowerCase() !== 'nama folder' && linkUrl.length > 0) {
                if (statusCol.toUpperCase() !== 'TELAH DICABUT') {
                  fileRecords.push(folderName);
                  fileMap.set(folderName, linkUrl);
                } else {
                  drawnWinnersSet.add(folderName); // Masukkan dalam senarai elak pilih
                }
              }
            });

            // Status Pangkalan Data Aktiviti
            if (fileRecords.length > 0) {
              badge.innerText = "PANGKALAN DATA AKTIF";
              badge.className = "px-4 py-1.5 rounded-full text-xs font-semibold tracking-widest uppercase bg-emerald-500/10 text-emerald-400 border border-emerald-500/30";
            } else {
              badge.innerText = "PANGKALAN DATA TIDAK AKTIF";
              badge.className = "px-4 py-1.5 rounded-full text-xs font-semibold tracking-widest uppercase bg-red-500/10 text-red-400 border border-red-500/30";
            }
          }
        });
      } catch (err) {
        console.warn("Gagal memuatkan Google Sheets:", err);
        badge.innerText = "PANGKALAN DATA TIDAK AKTIF";
        badge.className = "px-4 py-1.5 rounded-full text-xs font-semibold tracking-widest uppercase bg-red-500/10 text-red-400 border border-red-500/30";
      }
    }

    loadGoogleSheetsData();

    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playHeartbeatThump(intensity = 0.4) {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(110, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(26, ctx.currentTime + 0.14);
        gain.gain.setValueAtTime(intensity, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.16);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.16);
      } catch (e) {}
    }

    function startDrone(durationSec) {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(60, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + durationSec);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(220, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(2200, ctx.currentTime + durationSec);

        gain.gain.setValueAtTime(0.02, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.24, ctx.currentTime + durationSec);
        gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + durationSec + 0.05);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + durationSec + 0.05);
      } catch (e) {}
    }

    function playStepTick(pitch = 420) {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(pitch, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch (e) {}
    }

    function playLockSound(toneType) {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        let freq = 340;
        let vol = 0.06;
        let type = 'square';

        if (toneType === 'suspense') {
          freq = 540;
          vol = 0.16;
          type = 'triangle';
        } else if (toneType === 'semi-final') {
          freq = 750;
          vol = 0.28;
          type = 'triangle';
        } else if (toneType === 'final') {
          freq = 1050;
          vol = 0.45;
          type = 'triangle';
        }

        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch (e) {}
    }

    function playWinnerAudio() {
      try {
        const ctx = getAudioContext();
        const subOsc = ctx.createOscillator();
        const subGain = ctx.createGain();
        subOsc.type = 'sine';
        subOsc.frequency.setValueAtTime(140, ctx.currentTime);
        subOsc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.7);
        subGain.gain.setValueAtTime(0.65, ctx.currentTime);
        subGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.85);
        subOsc.connect(subGain);
        subGain.connect(ctx.destination);
        subOsc.start();
        subOsc.stop(ctx.currentTime + 0.85);

        [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + (idx * 0.07));
          gain.gain.setValueAtTime(0.12, ctx.currentTime + (idx * 0.07));
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (idx * 0.07) + 0.6);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + (idx * 0.07));
          osc.stop(ctx.currentTime + (idx * 0.07) + 0.6);
        });
      } catch (e) {}
    }

    function startDrawFlow() {
      if (isDrawing || fileRecords.length === 0) return;
      isDrawing = true;

      const btnDraw = document.getElementById('btnDraw');
      btnDraw.disabled = true;
      btnDraw.classList.add('opacity-50', 'cursor-not-allowed');

      executeSuspenseDrawForSlot(() => {
        btnDraw.disabled = false;
        btnDraw.classList.remove('opacity-50', 'cursor-not-allowed');
        isDrawing = false;
      });
    }

    function executeSuspenseDrawForSlot(onComplete) {
      const board = document.getElementById('boardContainer');
      const overlay = document.getElementById('suspenseOverlay');
      const slotBadge = document.getElementById('slotBadge');
      const statusText = document.getElementById('statusText');
      const winnerBox = document.getElementById('currentWinnerBox');
      const winnerNameEl = document.getElementById('currentWinnerName');
      const winnerFileNoEl = document.getElementById('currentWinnerFileNo');
      const mainLinkInput = document.getElementById('mainLinkInput');
      const qrContainer = document.getElementById('qrcode');

      slotBadge.innerText = `Sedang Mencabut No. Fail`;
      statusText.innerText = `Menyaring pangkalan data Google Sheets...`;
      winnerBox.classList.add('opacity-0');
      board.classList.add('heartbeat-box', 'border-red-500/80');
      overlay.classList.add('opacity-100');

      // Pilih rawak daripada senarai fail aktif
      const randomIndex = Math.floor(Math.random() * fileRecords.length);
      const targetFileNo = fileRecords[randomIndex];
      const targetUrl = fileMap.get(targetFileNo) || '';
      
      // Buang fail ini dari senarai aktif tempatan supaya tidak dipilih lagi dalam sesi sama
      fileRecords.splice(randomIndex, 1);
      drawnWinnersSet.add(targetFileNo);

      // Hantar arahan kemas kini ke Google Sheets secara latar belakang
      markFileAsDrawnInSheet(targetFileNo);

      const targetChars = targetFileNo.padEnd(5, ' ').split('');

      startDrone(7.5);

      let hbTimer = null;
      let hbDelay = 260;
      function beat() {
        if (!isDrawing) return;
        playHeartbeatThump(hbDelay <= 130 ? 0.75 : 0.35);
        if (hbDelay > 90) hbDelay -= 6;
        hbTimer = setTimeout(beat, hbDelay);
      }
      beat();

      const digitEls = Array.from({length: 5}, (_, i) => document.getElementById(`d${i}`));
      const intervals = [];

      const prefixes = ["S", "A", "B", "K", "M", "P", "R"];
      digitEls[0].classList.add('blur-motion', 'text-red-400');
      digitEls[0].classList.remove('text-emerald-400', 'border-emerald-500', 'ultra-glow');
      const iv0 = setInterval(() => {
        digitEls[0].innerText = prefixes[Math.floor(Math.random() * prefixes.length)];
      }, 40);
      intervals.push(iv0);

      for (let i = 1; i < 4; i++) {
        const el = digitEls[i];
        el.classList.add('blur-motion', 'text-red-400');
        el.classList.remove('text-emerald-400', 'border-emerald-500', 'ultra-glow');
        const iv = setInterval(() => {
          el.innerText = Math.floor(Math.random() * 10);
        }, 40);
        intervals.push(iv);
      }

      const finalEl = digitEls[4];
      finalEl.classList.add('blur-motion', 'text-red-400');
      finalEl.classList.remove('text-emerald-400', 'border-emerald-500', 'ultra-glow', 'solo-final-active');
      
      let finalDigitActive = true;
      function runInitialFinalSpin() {
        if (!finalDigitActive) return;
        finalEl.innerText = Math.floor(Math.random() * 10);
        setTimeout(runInitialFinalSpin, 45);
      }
      runInitialFinalSpin();

      const lockDelays = [800, 1800, 2800, 3800];

      for (let idx = 0; idx < 4; idx++) {
        setTimeout(() => {
          clearInterval(intervals[idx]);
          digitEls[idx].classList.remove('blur-motion', 'text-red-400');
          digitEls[idx].innerText = targetChars[idx];

          if (idx === 0) {
            playLockSound('normal');
            statusText.innerText = "Abjad Kategori Fail Dikunci...";
          } else if (idx === 1) {
            playLockSound('suspense');
            statusText.innerText = "Memasuki Digit Penentu...";
            digitEls[2].classList.add('ultra-glow');
            digitEls[3].classList.add('ultra-glow');
            digitEls[4].classList.add('ultra-glow');
          } else if (idx === 2) {
            digitEls[2].classList.remove('ultra-glow');
            playLockSound('suspense');
            statusText.innerText = "Tinggal 2 Digit Terakhir...";
          } else if (idx === 3) {
            digitEls[3].classList.remove('ultra-glow');
            playLockSound('semi-final');
            statusText.innerText = "DETIK MENDENGKANG: Angka Terakhir Sedang Berputar Super Slow...";
            
            finalDigitActive = false;
            startUltraSlowFinalSequence();
          }
        }, lockDelays[idx]);
      }

      function startUltraSlowFinalSequence() {
        finalEl.classList.remove('blur-motion', 'ultra-glow');
        finalEl.classList.add('solo-final-active', 'text-amber-300');

        const slowDelays = [90, 110, 140, 180, 230, 290, 360, 440, 530, 640, 700];
        let stepIndex = 0;

        function stepSlowRoll() {
          if (stepIndex < slowDelays.length) {
            const currentDelay = slowDelays[stepIndex];
            
            finalEl.innerText = Math.floor(Math.random() * 10);
            playStepTick(360 + (stepIndex * 28));

            if (stepIndex >= 6) {
              statusText.innerText = "SEMAKIN HAMPIR... ANGKA TERAKHIR SEDANG DIKUNCI...";
            }

            stepIndex++;
            setTimeout(stepSlowRoll, currentDelay);
          } else {
            finalEl.innerText = targetChars[4];
            finalEl.classList.remove('solo-final-active', 'text-amber-300');
            
            playLockSound('final');
            clearTimeout(hbTimer);

            board.classList.remove('heartbeat-box', 'border-red-500/80');
            board.classList.add('border-emerald-500');
            overlay.classList.remove('opacity-100');

            digitEls.forEach(d => d.classList.add('text-emerald-400', 'border-emerald-500/60'));

            statusText.innerText = "Fail Disahkan Berjaya Dicabut & Direkodkan!";
            winnerNameEl.innerText = `FAIL ${targetFileNo}`;
            winnerFileNoEl.innerText = targetFileNo;
            
            currentActiveFolderUrl = targetUrl;
            mainLinkInput.value = targetUrl;

            // Jana QR Code secara automatik
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
              text: targetUrl,
              width: 90,
              height: 90,
              colorDark: "#000000",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.H
            });
            
            winnerBox.classList.remove('opacity-0');

            playWinnerAudio();
            confetti({ 
              particleCount: 100, 
              spread: 70, 
              origin: { y: 0.65 } 
            });

            if (onComplete) onComplete();
          }
        }

        stepSlowRoll();
      }
    }
  </script>
</body>
</html>
